name: CI

# Одна команда на всё: C-рантайм src/vtm, Python-набор, реестр задач,
# документация VTM и проверка, что тесты не зависят от собранных артефактов.
# Локальный аналог: `python3 tools/ci.py` (он же повторяет все шаги целиком).
#
# Матрица: ubuntu-latest — эталонный «чистый» Linux; macos-latest — машины
# разработки. Системные TTS-бинарники (say, afplay, espeak) в тестах не
# запускаются, отсутствие внешних команд тесты скипают, а не падают.

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Зависимости не ставим: C-часть собирается стандартным cc/c++,
      # Python-часть обязана работать на стандартной библиотеке.

      - name: C tests (make -C src/vtm test)
        working-directory: src/vtm
        run: make test

      # Если C-сборка упала, её вывод нужно увидеть в аннотациях: логи job'а
      # требуют токена, а `::error::` из workflow-команд доступен через API.
      - name: C build diagnostics
        if: failure()
        working-directory: src/vtm
        run: |
          echo "compiler: $(${CC:-cc} --version | head -1)"
          echo "machine: $(uname -srm)"
          make clean >/dev/null 2>&1 || true
          make 2>&1 | tee /tmp/build.log || true
          grep -E "error:|Error [0-9]" /tmp/build.log | head -10 | while IFS= read -r line; do
            echo "::error file=src/vtm/Makefile::$line"
          done
          # Сборка прошла, но упал тест: показываем строки провала как аннотации.
          make test 2>&1 | tee /tmp/test.log || true
          grep -nE "FAIL|fail|error|Error|assert|Assertion|Segmentation|abort|Abort|ошибк|Ошибк|OK|ok" /tmp/test.log \
            | tail -25 | while IFS= read -r line; do
            echo "::error file=src/vtm/Makefile::$line"
          done

      - name: Python tests (unittest discover)
        run: python3 -m unittest discover -s tests

      - name: Task registry (tools/check_tasks.py)
        run: python3 tools/check_tasks.py

      - name: VTM docs (tools/check_vtm_docs.py)
        run: python3 tools/check_vtm_docs.py

      # Свежесть документации (0164): у каждого docs/*.md, кроме adr/, есть
      # «Актуально на ГГГГ-ММ-ДД»; старше 30 дней или дата из будущего — красный.
      # Там же проверяются ссылки docs/ и README (0 битых).
      - name: Docs freshness (tools/check_docs_dates.py)
        run: python3 tools/check_docs_dates.py

      # Всё то же одной командой плюс проверка «Python-набор проходит после
      # make clean». Шаги выше дают точную локализацию падения, этот —
      # повторяемость на чистом дереве.
      - name: Full check (tools/ci.py)
        run: python3 tools/ci.py
