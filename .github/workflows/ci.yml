name: CI

# Одна команда на всё: C-рантайм src/vtm, Python-набор, реестр задач,
# документация VTM и проверка, что тесты не зависят от собранных артефактов.
# Локальный аналог: `python3 tools/ci.py` (он же повторяет все шаги целиком).
#
# Матрица: ubuntu-latest — эталонный «чистый» Linux; macos-latest — машины
# разработки. Системные TTS-бинарники (say, afplay, espeak) в тестах не
# запускаются, отсутствие внешних команд тесты скипают, а не падают.

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Зависимости не ставим: C-часть собирается стандартным cc/c++,
      # Python-часть обязана работать на стандартной библиотеке.

      - name: C tests (make -C src/vtm test)
        working-directory: src/vtm
        run: make test

      - name: Python tests (unittest discover)
        run: python3 -m unittest discover -s tests

      - name: Task registry (tools/check_tasks.py)
        run: python3 tools/check_tasks.py

      - name: VTM docs (tools/check_vtm_docs.py)
        run: python3 tools/check_vtm_docs.py

      # Всё то же одной командой плюс проверка «Python-набор проходит после
      # make clean». Шаги выше дают точную локализацию падения, этот —
      # повторяемость на чистом дереве.
      - name: Full check (tools/ci.py)
        run: python3 tools/ci.py
